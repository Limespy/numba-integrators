[tox]
minversion = 4.16.0
envlist = py311, py313
isolated_build = true

[gh-actions]
python =
    3.11: py311
    3.13: py313

[testenv]
set_env =
    PYTHONPATH = {toxinidir}
deps =
    -r {toxinidir}/dependencies/requirements.txt
    -r {toxinidir}/dependencies/requirements_test_functional.txt
commands =
    pytest --basetemp="{envtmpdir}" \
           --config-file={toxinidir}/tests/unittests/pytest.ini
